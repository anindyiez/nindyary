<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerary Liburan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302f;--mute:#6b7f7d;--line:#e2eae7;--hero1:#17413f;--hero2:#2a6b66;--rose:#e0607e;--rose-s:#fde6ec;--gold:#f2b84b;--ok:#2f9e78;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1a;--card:#172625;--ink:#e8f1ef;--mute:#8da5a2;--line:#243836;--hero1:#0b2a29;--hero2:#1d524e;--rose:#ef7a96;--rose-s:#3a2229;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b1a;--card:#172625;--ink:#e8f1ef;--mute:#8da5a2;--line:#243836;--hero1:#0b2a29;--hero2:#1d524e;--rose:#ef7a96;--rose-s:#3a2229;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
body{max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.head{margin:12px 14px 0;padding:24px 16px 16px;border-radius:28px;background:var(--rose-s);text-align:center;position:relative}.head .wl{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose);font-weight:600}.head h1{font-size:30px;line-height:1.1;margin:6px 0 8px}.head .sub{font-size:14px;opacity:.8}.head .chips{justify-content:center;margin-top:12px}.head .chip{background:var(--card);color:var(--ink);font-size:12.5px}.head .chip.g{background:var(--gold);color:#3a2a00}.head .edit{right:12px;top:12px;background:var(--card);color:var(--rose);padding:5px 12px;font-size:12.5px;font-weight:600}
.hero{margin:12px 14px 0;padding:22px 20px 20px;border-radius:28px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--rose);opacity:.35}
.hero small{opacity:.8;font-size:13px}
.hero h1{font-size:30px;line-height:1.1;margin:6px 0 10px;padding-right:64px;position:relative;z-index:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:13px}
.chip.g{background:var(--gold);color:#3a2a00;font-weight:600}
.edit{position:absolute;right:14px;top:14px;z-index:2;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 13px;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;min-width:62px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px 10px;cursor:pointer}
.d b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
.d span{font-size:11.5px;color:var(--mute)}
.d.on{background:var(--rose);border-color:var(--rose);color:#fff}.d.on span{color:#fff;opacity:.9}
.sec{padding:8px 14px}
.dh{flex-wrap:wrap;gap:4px;display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 4px}
.dh h2{font-size:19px}.dh span{color:var(--mute);font-size:13px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 12px 14px;margin:10px 0;position:relative}
.item.done{opacity:.55}.item.done .t{text-decoration:line-through}
.tm{flex:0 0 46px;font-weight:600;font-size:14px;padding-top:2px}
.ic{flex:0 0 38px;height:38px;border-radius:13px;background:var(--rose-s);display:grid;place-items:center;font-size:19px}
.bd2{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600}.pl,.nt{color:var(--mute);font-size:13px}
.cost{display:inline-block;margin-top:5px;font-size:12.5px;background:var(--bg);border-radius:99px;padding:2px 10px}
.gl{font-size:12px;color:var(--mute);font-weight:600;margin:2px 0 8px}.gl+.g3+.gl,.g3+.gl{margin-top:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk.b{display:block;text-align:center;padding:11px 6px;border-radius:14px;font-size:13px}select.lk{width:auto;border:0;-webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer}
.dd{position:relative;display:inline-block}.dd summary{list-style:none;cursor:pointer}.dd summary::-webkit-details-marker{display:none}.ddm{position:absolute;z-index:8;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:150px;box-shadow:0 8px 20px rgba(0,0,0,.18)}.ddm a{display:block;padding:10px 12px;text-decoration:none;color:var(--ink);border-radius:10px;font-size:14px}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer}
.lks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.lk{font-size:12.5px;text-decoration:none;color:var(--rose);background:var(--rose-s);border-radius:99px;padding:4px 11px;font-weight:600}.lk.wide{display:block;text-align:center;background:var(--rose);color:#fff;padding:12px;border-radius:16px;font-size:14px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:0 0 26px;align-self:center;display:grid;place-items:center;color:#fff;font-size:14px}
.done .ck{background:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:36px 20px;border:1.5px dashed var(--line);border-radius:22px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:10px 0}
.big{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.over i{background:var(--rose)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cr{margin:12px 0}.cr .bar{margin:5px 0 0;height:8px}.cr .bar i{background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--bg);border-radius:16px;padding:10px 12px}.mini small{color:var(--mute)}.mini b{display:block}
.pk{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.pk .t{flex:1}.x{border:0;background:none;color:var(--mute);font-size:18px;padding:4px 8px}
.add{display:flex;gap:8px;margin:12px 0}
.add input{flex:1}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
.btn{border:0;background:var(--rose);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:none;color:var(--rose);border:1px solid var(--rose)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:5}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--mute);font-size:11.5px}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--rose);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:20px;border:0;background:var(--rose);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(224,96,126,.4);z-index:6}
#sh{display:none;position:fixed;inset:0;z-index:20}#sh.on{display:block}
.bk{position:absolute;inset:0;background:rgba(10,25,24,.5)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.pn h3{font-size:21px;margin-bottom:12px}
.f{margin:10px 0}.f label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;gap:7px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px}
.cats button.on{background:var(--rose);border-color:var(--rose);color:#fff}
.acts{display:flex;gap:10px;margin-top:16px}.acts .btn:last-child{flex:1}
@media (prefers-reduced-motion:reduce){.pn{animation:none}}
</style></head>
<body>
<div id="app"></div><div id="sh"></div>
<script>
const $=s=>document.querySelector(s);
const CATS={transport:['✈️','Transport'],stay:['🏨','Penginapan'],food:['🍜','Makan'],sight:['🏛️','Wisata'],shop:['🛍️','Belanja'],other:['✨','Lainnya']};
window.TRIPID=(()=>{let c=location.hash.replace(/[^\w-]/g,'');if(!c){try{c=localStorage.getItem('lastTrip')||''}catch(e){}}if(!c)c=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);try{localStorage.setItem('lastTrip',c)}catch(e){}if(!location.hash){try{location.hash=c}catch(e){}}return c})();
const LS='itin_'+window.TRIPID;
let S,tab='info',day=0,cat='sight';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const def=()=>({trip:{name:'',dest:'',start:'',end:'',budget:20000000},items:[],pack:['Paspor','Tiket dan boarding pass','Charger dan power bank','Adaptor colokan','Obat pribadi','Uang tunai dan kartu','Pakaian sesuai cuaca','Asuransi perjalanan'].map(t=>({id:uid(),t,done:false})),notes:[]});
function load(){try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}if(!S)S=def()}
let SYNC='';
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(window.FBpush)window.FBpush(JSON.stringify(S))}
function days(){const{start,end}=S.trip;if(!start||!end)return[];const a=new Date(start+'T00:00'),b=new Date(end+'T00:00');if(isNaN(a)||isNaN(b)||b<a)return[];const n=Math.min(30,Math.round((b-a)/864e5)+1);return Array.from({length:n},(_,i)=>{const d=new Date(a);d.setDate(a.getDate()+i);return d})}
const fd=(d,o)=>d.toLocaleDateString('id-ID',o);
function countdown(){if(!S.trip.start)return'';const n=Math.ceil((new Date(S.trip.start+'T00:00')-new Date())/864e5);return n>0?'H-'+n:n>-1?'Berangkat hari ini':'Sedang atau sudah lewat'}
function mig(){S.items.forEach(x=>{if(x.real===undefined){if(x.exp){x.real=+x.cost||0;x.cost=0}else x.real=x.done?(+x.cost||0):0}})}
function render(){mig();
 const D=days(),t=S.trip;if(day>=D.length)day=0;
 let h=`<div class="head"><button class="edit" onclick="tripSheet()">Ubah</button><div class="wl">welcome to</div><h1>${esc(t.title||('The '+(t.dest||'Jakarta')+' Diaries'))}</h1><div class="sub">${esc(t.sub||'Anindya & Najma · two girls, one city, zero rush')}</div><div class="chips">${D.length?`<span class="chip">${fd(D[0],{day:'numeric',month:'short'})} sampai ${fd(D[D.length-1],{day:'numeric',month:'short',year:'numeric'})}</span><span class="chip">${D.length} hari</span>`:'<span class="chip">Atur tanggal dulu</span>'}${countdown()?`<span class="chip g">${countdown()}</span>`:''}${SYNC?`<span class="chip">${SYNC}</span>`:''}</div></div>`;
 if(tab==='plan')h+=plan(D);else if(tab==='bud')h+=budget(D);else if(tab==='pack')h+=pack();else if(tab==='gal')h+=gallery();else h+=info();
 h+=`<div class="nav"><div>${[['info','📌','Info'],['plan','🗓️','Rencana'],['bud','💸','Realisasi'],['pack','🧳','Bawaan'],['gal','🖼️','Galeri']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render();scrollTo(0,0)"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`;
 if(tab!=='pack'&&tab!=='gal')h+=`<button class="fab" aria-label="Tambah" onclick="${tab==='info'?'noteSheet()':'itemSheet()'}">+</button>`;
 $('#app').innerHTML=h;loadWx();
}
function plan(D){
 if(!D.length)return`<div class="sec"><div class="empty">Isi nama trip, tujuan, dan tanggal dulu supaya hari-harinya muncul.<br><br><button class="btn" onclick="tripSheet()">Atur trip</button></div></div>`;
 let h=planDash()+`<div class="sec" style="padding-bottom:0"><button class="btn s" style="width:100%" onclick="suggestSheet()">✨ Saran urutan dan pengelompokan tempat</button></div><div class="days">${D.map((d,i)=>`<div class="d ${i===day?'on':''}" onclick="day=${i};render()"><b>${d.getDate()}</b><span>${fd(d,{weekday:'short'})} · H${i+1}</span></div>`).join('')}</div>`;
 h+=wxCard(D[day]);const its=S.items.filter(x=>(x.day===day||(x.day2!=null&&x.day<day&&x.day2>=day))&&!x.exp).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')||((a.ord||0)-(b.ord||0)));
 const dayAll=S.items.filter(x=>x.day===day),tot=dayAll.reduce((s,x)=>s+(+x.cost||0),0),rl=dayAll.reduce((s,x)=>s+(+x.real||0),0);
 h+=`<div class="sec"><div class="dh"><h2>Hari ${day+1}, ${fd(D[day],{weekday:'long',day:'numeric',month:'long'})}</h2><span>${tot?'Rencana '+rp(tot):''}${rl?' · Real '+rp(rl)+' ':' '}<a class="lk" href="https://www.google.com/search?q=${encodeURIComponent('cuaca '+(S.trip.dest||'')+' '+fd(D[day],{day:'numeric',month:'long',year:'numeric'}))}" target="_blank" rel="noopener">🌤️ Cuaca</a></span></div>`;
 if(!its.length)h+=`<div class="empty">Belum ada rencana di hari ini.<br>Ketuk tombol + untuk menambah.</div>`;
 its.forEach(x=>{const c=CATS[x.cat]||CATS.other;h+=`<div class="item ${x.done?'done':''}"><div class="tm">${esc(x.time)||'--:--'}</div><div class="ic">${c[0]}</div><div class="bd2" onclick="itemSheet('${x.id}')"><div class="t">${esc(x.title)}</div>${x.place?`<div class="pl">📍 ${esc(x.place)}</div>`:''}${x.note?`<div class="nt">${esc(x.note)}</div>`:''}${lns(x)}${x.day2!=null&&D[x.day]&&D[x.day2]?`<span class="cost">🌙 ${fd(D[x.day],{day:'numeric',month:'short'})} – ${fd(D[x.day2],{day:'numeric',month:'short'})} · ${x.day2-x.day} malam</span> `:''}${+x.cost&&x.day===day?`<span class="cost">Rencana ${rp(x.cost)}</span> `:''}${+x.real&&x.day===day?`<span class="cost" style="background:var(--rose-s);color:var(--rose)">Real ${rp(x.real)} · ${esc(ppl()[x.payer||0]||'')}</span>`:''}${links(x)}</div><button class="ck" aria-label="Selesai" onclick="tog('${x.id}')">${x.done?'✓':''}</button></div>`});
 return h+'</div>';
}
const WC={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
let WX=null,WXkey='';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function loadWx(){
 const t=S.trip;if(!t.dest||!t.start){WX=null;return}
 const key=t.dest+'|'+t.start;if(key===WXkey)return;WXkey=key;WX={st:'load'};
 try{
  const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=id&name='+encodeURIComponent(t.dest.split(',')[0].trim()))).json();
  if(!g.results||!g.results[0]){WX={st:'nf'};render();return}
  const r=g.results[0];
  const f=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude='+r.latitude+'&longitude='+r.longitude+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16')).json();
  WX={st:'ok',place:r.name+(r.country?', '+r.country:''),days:f.daily};
 }catch(e){WX={st:'err'}}
 render();
}
function wxCard(d){
 if(!WX)return'';const box=t=>'<div class="card" style="margin:10px 14px 0;padding:12px 16px">'+t+'</div>';
 if(WX.st==='load')return box('<span class="pl">Memuat cuaca...</span>');
 if(WX.st==='nf')return box('<span class="pl">Cuaca: kota tujuan tidak ditemukan. Coba tulis nama kotanya saja.</span>');
 if(WX.st!=='ok')return box('<span class="pl">Cuaca gagal dimuat. Cek koneksi lalu muat ulang.</span>');
 const D=WX.days,i=D.time.indexOf(ymd(d));
 if(i<0)return box('<span class="pl">Prakiraan untuk tanggal ini belum tersedia. Prakiraan hanya ada sampai 16 hari ke depan.</span>');
 const p=D.precipitation_probability_max[i];
 return box('<div class="row"><div><span style="font-size:30px">'+(WC[D.weather_code[i]]||'🌡️')+'</span> <b>'+Math.round(D.temperature_2m_min[i])+'° sampai '+Math.round(D.temperature_2m_max[i])+'°C</b></div><span class="pl">Hujan '+(p==null?'-':p+'%')+'</span></div><div class="pl">'+esc(WX.place)+'</div>');
}
const ppl=()=>(S.trip.people&&S.trip.people.length?S.trip.people:['Nindy','Najma']);
const dd=(label,o)=>'<details class="dd"><summary class="lk">'+label+' ▾</summary><div class="ddm">'+o.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener" onclick="this.closest(\'details\').open=false">'+x[0]+'</a>').join('')+'</div></details>';
const FLY=[['Tiket.com','https://www.tiket.com/pesawat'],['Traveloka','https://www.traveloka.com/id-id/flight']],HTL=[['Tiket.com','https://www.tiket.com/hotel'],['Traveloka','https://www.traveloka.com/id-id/hotel']];
function rurl(){const q=($('#rt')||{value:''}).value.trim();return q?'https://www.google.com/maps/dir/?api=1&travelmode=transit&destination='+encodeURIComponent(q+' '+(S.trip.dest||'')):'#'}
function ru(){const a=$('#rl');if(a)a.href=rurl()}
function balCard(){const P=ppl(),n=P.length,pd=Array(n).fill(0),sh=Array(n).fill(0);
 S.items.forEach(x=>{const c=+x.real||0;if(!c)return;const p=Math.min(+x.payer||0,n-1);pd[p]+=c;if(x.split==='sendiri')sh[p]+=c;else for(let i=0;i<n;i++)sh[i]+=c/n});
 const net=pd.map((a,i)=>a-sh[i]);let t='Impas, tidak ada utang piutang.';

    const r=ref(db,'trips/'+window.TRIPID),P='photos/'+window.TRIPID;
    window.FBphoto={add:(id,m,f)=>Promise.all([set(ref(db,P+'/meta/'+id),m),set(ref(db,P+'/full/'+id),f)]),meta:(id,m)=>set(ref(db,P+'/meta/'+id),m),del:id=>Promise.all([remove(ref(db,P+'/meta/'+id)),remove(ref(db,P+'/full/'+id))]),full:id=>get(ref(db,P+'/full/'+id)).then(x=>x.val())};
    onValue(ref(db,P+'/meta'),x=>window.setPhotos(x.val()),()=>{});
    let first=true;
    window.FBpush=str=>set(r,{state:str,t:Date.now()}).catch(()=>window.setSync('Gagal menyimpan'));
    onValue(r,snap=>{
      const v=snap.val();
      if(v&&v.state)window.applyRemote(v.state);
      else if(first&&window.hasLocal())window.FBpush(JSON.stringify(S));
      first=false;window.setSync('🔄 Tersinkron');
    },()=>window.setSync('Gagal sinkron'));
  }catch(e){window.setSync('Firebase error')}
}
</script>
